[project]
name = "ai-gateway"
version = "0.1.0"
description = "Unified inference gateway (generate/embed/classify/extract/decide/predict) with client and test harness"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx2"]

[project.scripts]
ai-gateway = "ai_gateway.__main__:main"
gateway-harness = "ai_gateway_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_gateway", "src/ai_gateway_client", "src/ai_gateway_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
